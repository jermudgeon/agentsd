<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <script src="sdpi-components.js"></script>
</head>
<body>
  <sdpi-item label="Config dir">
    <sdpi-textfield setting="configDir" placeholder="auto (next account)"></sdpi-textfield>
  </sdpi-item>
  <sdpi-item label="Window">
    <sdpi-select setting="window" placeholder="auto">
      <option value="fiveHour">5-hour</option>
      <option value="sevenDay">7-day</option>
    </sdpi-select>
  </sdpi-item>
  <sdpi-item label="Label">
    <sdpi-textfield setting="label" placeholder="auto"></sdpi-textfield>
  </sdpi-item>
</body>
</html>
